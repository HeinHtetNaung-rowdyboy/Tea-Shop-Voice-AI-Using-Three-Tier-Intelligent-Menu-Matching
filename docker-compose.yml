services:
  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    env_file: .env
    volumes:
      - ./data:/app/data
    expose:
      - '8000'
    restart: unless-stopped
  ui:
    build: .
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    env_file: .env
    environment:
      BACKEND_API_URL: http://api:8000
    ports:
      - '8501:8501'
    depends_on:
      - api
    restart: unless-stopped
